# Tempo as a single process with blocks on the container disk: for an example, not for load.
stream_over_http_enabled: true

server:
  http_listen_port: 3200
  log_level: info

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

metrics_generator:
  registry:
    external_labels:
      source: tempo
  storage:
    path: /var/tempo/generator/wal
    remote_write:
      - url: http://victoriametrics:8428/api/v1/write
  processor:
    span_metrics:
      # On top of service, name, kind and status of the span. Only labels with a bounded set of values.
      dimensions:
        - http.route
        - http.request.method
        - http.response.status_code
        - db.system.name
        - server.address
      # From half a millisecond: in-process calls finish below the default first bucket of 2 ms.
      histogram_buckets: [0.0005, 0.001, 0.002, 0.004, 0.008, 0.016, 0.032, 0.064, 0.128, 0.256, 0.512, 1.024, 2.048, 4.096, 8.192]

# Three days of traces: enough to follow anything back from a log line or a panel.
backend_worker:
  compaction:
    block_retention: 72h

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

overrides:
  defaults:
    metrics_generator:
      processors: [span-metrics]

usage_report:
  reporting_enabled: false
