# Git hooks via prek: https://prek.j178.dev
#:schema https://www.schemastore.org/prek.json

[[repos]]
repo = "https://github.com/pre-commit/pre-commit-hooks"
rev = "v5.0.0"
hooks = [
  { id = "end-of-file-fixer" },
  { id = "trailing-whitespace" },
  { id = "check-merge-conflict" },
  {
    id = "check-added-large-files",
    exclude = '^uv\.lock$'
  },
  # A Kubernetes manifest holds several documents.
  {
    id = "check-yaml",
    args = ["--allow-multiple-documents"]
  },
  { id = "check-toml" }
]

[[repos]]
repo = "https://github.com/gitleaks/gitleaks"
rev = "v8.21.0"
hooks = [
  { id = "gitleaks" }
]

[[repos]]
repo = "local"
hooks = [
  {
    id = "ruff",
    name = "ruff",
    entry = "just lint ruff",
    language = "system",
    types = ["python"],
    pass_filenames = false
  },
  {
    id = "flake8",
    name = "flake8",
    entry = "just lint flake8",
    language = "system",
    files = "^src/",
    types = ["python"],
    pass_filenames = false
  },
  {
    id = "slotscheck",
    name = "slotscheck",
    entry = "just lint slotscheck",
    language = "system",
    files = "^src/",
    types = ["python"],
    pass_filenames = false
  },
  {
    id = "spelling",
    name = "spelling",
    entry = "just lint spelling",
    language = "system",
    files = "^src/",
    types = ["python"],
    pass_filenames = false
  },
  {
    id = "pyproject",
    name = "pyproject",
    entry = "just lint pyproject",
    language = "system",
    files = '^pyproject\.toml$',
    pass_filenames = false
  },
  {
    id = "mypy",
    name = "mypy",
    entry = "just lint mypy",
    language = "system",
    files = "^src/",
    types = ["python"],
    pass_filenames = false
  }
]
