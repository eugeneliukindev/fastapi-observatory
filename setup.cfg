[flake8]
select = WPS, E99

# Code inside docstring examples is code too.
doctests = true

# The only relaxation for the whole codebase, and it is not a reserve: the style's limit is designed
# for an 80-character line, ours is 120, and one and a half times as many nodes fit on it.
max-line-complexity = 21

ignore =
  WPS412
  # Counted by ruff's PLR0913.
  WPS211
  # `__all__` is not metadata here but the package's façade: it lives only in `__init__.py`, and
  # there it is the only reason the file exists. Whatever the list does not name is internal.
  WPS410

# Below are per-file relaxations. A limit raised for the whole codebase goes quiet everywhere for
# the sake of a dozen files; a named file with a reason stays visible and is dropped when the
# reason goes away.
per-file-ignores =
  # The settings are one model per group: the common ones, one per server, the database and the
  # telemetry — a module of small classes by design.
  src/config.py: WPS202
  # The access log stands on starlette: its middleware, request, response and application types
  # each live in a module of their own.
  src/middleware.py: WPS201
  # Starting process telemetry: a provider, an exporter and a batching wrapper per signal, plus the
  # profiler and its span link — the SDKs have no common name for these sets.
  src/observability/_telemetry.py: WPS201
  # The composition root exists to bring everything together in one place. The only nested function
  # is the application lifespan, nested so that it closes exactly what the root opened without
  # retelling it to itself through parameters:
  src/app.py: WPS201, WPS213, WPS210, WPS430
  # One handler per route, and the work two of them burn the CPU with; the handlers get every
  # client they touch as a dependency:
  src/router.py: WPS201, WPS202
