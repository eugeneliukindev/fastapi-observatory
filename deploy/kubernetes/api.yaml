apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: api
  ports:
    - name: http
      port: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  # Two pods of two workers each: instances and workers on the dashboard are no longer equal.
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api
    spec:
      containers:
        - name: api
          # Built locally and imported into the cluster by `just k8s-up`.
          image: observatory-api:dev
          imagePullPolicy: Never
          env:
            - name: OBSERVATORY__SERVER__KIND
              value: gunicorn
            - name: OBSERVATORY__SERVER__HOST
              value: 0.0.0.0
            - name: OBSERVATORY__SERVER__WORKERS
              value: "2"
            - name: OBSERVATORY__LOG_LEVEL
              value: info
            - name: OBSERVATORY__OBS__FARO__COLLECTOR_URL
              value: http://localhost:12347/collect
            - name: OBSERVATORY__OBS__OTLP__ENDPOINT
              value: http://alloy:4317
            - name: OBSERVATORY__OBS__PYROSCOPE__URL
              value: http://alloy:4040
            - name: OBSERVATORY__OBS__ENVIRONMENT
              value: development
            # Where the process runs, from the downward API: the SDK reads OTEL_RESOURCE_ATTRIBUTES
            # into every signal's resource. It must come after the variables it refers to.
            - name: K8S_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: K8S_POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: K8S_NAMESPACE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: K8S_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: k8s.pod.name=$(K8S_POD_NAME),k8s.pod.uid=$(K8S_POD_UID),k8s.namespace.name=$(K8S_NAMESPACE_NAME),k8s.node.name=$(K8S_NODE_NAME),k8s.container.name=api
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: http
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir: {}
