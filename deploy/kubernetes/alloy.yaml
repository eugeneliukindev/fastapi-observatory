# Reads the pods of its own namespace and their output: nothing beyond it.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: alloy
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: alloy
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: alloy
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: alloy
subjects:
  - kind: ServiceAccount
    name: alloy
---
# A load balancer so k3d can publish the UI and the Faro port to the host, as Compose does.
apiVersion: v1
kind: Service
metadata:
  name: alloy
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: alloy
  ports:
    - name: otlp-grpc
      port: 4317
    - name: otlp-http
      port: 4318
    - name: profiles
      port: 4040
    - name: ui
      port: 12345
    - name: faro
      port: 12347
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: alloy
spec:
  serviceName: alloy
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: alloy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: alloy
    spec:
      serviceAccountName: alloy
      containers:
        - name: alloy
          image: grafana/alloy:v1.20.1
          args:
            - run
            - --server.http.listen-addr=0.0.0.0:12345
            - --storage.path=/var/lib/alloy/data
            # Every *.alloy in the directory: what any platform receives, and how Kubernetes
            # collects logs. The same path as in Compose, away from the image's example config.
            - /etc/alloy/observatory/
          ports:
            - name: otlp-grpc
              containerPort: 4317
            - name: otlp-http
              containerPort: 4318
            - name: profiles
              containerPort: 4040
            - name: ui
              containerPort: 12345
            - name: faro
              containerPort: 12347
          readinessProbe:
            httpGet:
              path: /-/ready
              port: ui
          volumeMounts:
            - name: config
              mountPath: /etc/alloy/observatory
            - name: storage
              mountPath: /var/lib/alloy/data
      volumes:
        - name: config
          configMap:
            name: alloy
  volumeClaimTemplates:
    - metadata:
        name: storage
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 1Gi
