apiVersion: v1
kind: Service
metadata:
  name: pyroscope
spec:
  selector:
    app.kubernetes.io/name: pyroscope
  ports:
    - name: http
      port: 4040
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: pyroscope
spec:
  serviceName: pyroscope
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pyroscope
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pyroscope
    spec:
      securityContext:
        fsGroup: 10001
      containers:
        - name: pyroscope
          image: grafana/pyroscope:2.3.1
          ports:
            - name: http
              containerPort: 4040
          readinessProbe:
            httpGet:
              path: /ready
              port: http
          volumeMounts:
            - name: storage
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: storage
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 2Gi
