apiVersion: v1
kind: Service
metadata:
  name: victoriametrics
spec:
  selector:
    app.kubernetes.io/name: victoriametrics
  ports:
    - name: http
      port: 8428
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: victoriametrics
spec:
  serviceName: victoriametrics
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: victoriametrics
  template:
    metadata:
      labels:
        app.kubernetes.io/name: victoriametrics
    spec:
      containers:
        - name: victoriametrics
          image: victoriametrics/victoria-metrics:v1.153.0
          args:
            - -storageDataPath=/storage
            - -httpListenAddr=:8428
            - -retentionPeriod=14d
            # One writer, no half-written intervals to hide: the newest seconds are queryable at once.
            - -search.latencyOffset=5s
          ports:
            - name: http
              containerPort: 8428
          readinessProbe:
            httpGet:
              path: /health
              port: http
          volumeMounts:
            - name: storage
              mountPath: /storage
  volumeClaimTemplates:
    - metadata:
        name: storage
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 2Gi
